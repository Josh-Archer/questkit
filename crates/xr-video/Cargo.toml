[package]
name = "xr-video"
version = "0.1.0"
edition = "2021"
authors = ["Josh Archer"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Josh-Archer/DeskQuest"

description = "Reusable Quest hardware video decoding, Vulkan resources, and audio output"
[dependencies]
ash = "0.38"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
audiopus = "0.3.0-rc.0"
audiopus_sys = { version = "0.2.2", features = ["static"] }
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["audio", "media", "nativewindow", "sync", "api-level-30"] }
ndk-sys = "0.6"
ndk-context = "0.1"
jni = "0.21"
# xr-core enables the static loader when used together. Standalone apps can opt in here.
openxr = { version = "0.22", default-features = false }

[features]
static-loader = ["openxr/static"]
