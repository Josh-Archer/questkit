[package]
name = "xr-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Reusable OpenXR sessions, composition layers, passthrough, and spatial placement"
keywords = ["quest","openxr","vr","xr","passthrough"]
categories = ["game-development","graphics"]
exclude = ["android/test_manifest.py"]

[dependencies]
xr-video = { path = "../xr-video", version = "0.1.0" }
ash = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.13"
libc = "0.2"
[target.'cfg(not(target_os = "android"))'.dependencies]
openxr = { version = "0.22", default-features = true }
[target.'cfg(target_os = "android")'.dependencies]
# The reusable crate owns the static loader; consumers need no separately packaged .so.
openxr = { version = "0.22", default-features = false, features = ["static"] }
ndk = { version = "0.9", features = ["nativewindow", "api-level-30"] }
ndk-context = "0.1"
